<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infosys Stock AI Chat</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="chatbot.css">

    <script>
        // Redirect to login if no user is found
        const user = localStorage.getItem('stockUser');
        if (!user) {
            window.stop();
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <h2>Infosys Stock AI</h2>
                </div>
                <nav>
                    <a href="index.html">Dashboard</a>
                    <a href="forecast.html">Forecast</a>
                    <a href="chatbot.html" class="active">Chatbot</a>
                </nav>
            </div>

            <div class="watchlist-section">
                <h3>Quick Command</h3>
                <div class="stock-list custom-scroll" id="quickCommands">
                    <button data-query="Closing price of INFY.NS">Closing Price of INFY</button>
                    <button data-query="OHLC of INFY.NS">OHLC of INFY</button>
                    <button data-query="Is INFY.NS Bull or Bear?">Trend of INFY</button>
                    <button data-query="52 week high and low of INFY.NS">52 Week High/Low</button>
                    <button data-query="Predict INFY.NS">Predict INFY</button>
                    <button data-query="help">Help / Guide</button>
                </div>
            </div>

            <div class="logout-btn">Sign Out</div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- HEADER -->
            <header class="chat-header-bar">
                <div class="assistant-profile">
                    <div class="assistant-details">
                        <h1>Chat Assist</h1>
                        <p class="status-text">Online • Ready to assist</p>
                    </div>
                </div>
            </header>

            <!-- CHAT WINDOW -->
            <div class="chat-container">
                <div class="chat-window custom-scroll" id="chatWindow">
                    <div class="message bot">
                        <div class="bubble">
                            Hello! I can help you with real-time stock prices and basic market queries. 
                            Try asking "What is the price of INFY.NS?"
                        </div>
                        <div class="timestamp">Just now</div>
                    </div>
                </div>

                <!-- INPUT AREA -->
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Type your question here..." autocomplete="off">
                    <button id="sendBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="chatbot.js"></script>
</body>
</html>
